# Qwen3-VL-4B Full Dataset Training (No K-Fold)
# Train on 90% of data (~3,688 samples) vs K-fold's 80% (~3,278 samples)

model:
  name: "Qwen/Qwen3-VL-4B-Instruct"
  use_flash_attention: true
  use_quantization: false
  torch_dtype: "bfloat16"

data:
  train_csv: "dataset/Train.csv"  # Using original (keeping duplicates unless leakage detected)
  test_csv: "dataset/Test.csv"
  image_dir: "dataset/images"

  # SINGLE SPLIT with VISUAL + TEXT DIFFICULTY stratification (analysis-driven)
  # Stratifies by: condition (3) × text difficulty (3) × digits (2) × names (2) = 36 bins
  # Ensures train/val have same distribution of:
  #   - Visual degradation (pristine/moderate/poor documents)
  #   - Text complexity (easy/medium/hard difficulty)
  #   - Numbers and names (harder OCR challenges)
  k_folds: 1  # Single 90/10 split (more data than k-fold's 67%)
  val_split: 0.1  # 90% train (~3,688), 10% val (~410)
  seed: 3407 # 42 or 3407 -- all previous runs used 42

  # Fuzzy duplicate detection - Prevents train/val leakage from boilerplate templates
  # Historical legal documents often share 90%+ text with only names/dates differing
  # Example: "This Indenture made [DATE] between [NAMES]..." → 95% similarity
  # Uses character 3-gram Jaccard similarity to group near-duplicates together
  # Set to 0.0 to disable fuzzy matching (only exact duplicates detected)
  fuzzy_duplicate_threshold: 0.85  # Recommended: 0.85-0.95 for historical legal docs

training:
  output_dir: "/content/drive/MyDrive/prd/qwen3-4B-single-textdiff-3"  # Single split with text difficulty stratification

  batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16

  # ELITE HYPERPARAMETERS - Optimized for 0.94 push
  epochs: 5  # Train longer (early stopping protects against overfitting)
  learning_rate: 0.00005  # 5e-5 (PROVEN - achieved 0.90 before, optimal convergence speed)
  warmup_ratio: 0.1  # Shorter warmup = reach peak LR faster (was 0.15)
  lr_scheduler: "cosine"

  # LIGHTER regularization for elite performance (allow model to learn more)
  weight_decay: 0.05
  max_grad_norm: 1.0
  gradient_checkpointing: true

  # Base rank/alpha - applies to anything NOT matched by rank_pattern below,
  # i.e. the LLM's q/k/v/o_proj (attention) and gate/up/down_proj (MLP).
  # UPDATED 2026-08-31: 16->32 per the hypothetical per-component ranking
  # (see rank_pattern comment) - LLM attention and MLP landed at the same
  # value in that table, so one base rank covers both without needing
  # separate rank_pattern entries for each LLM module.
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.1
  use_rslora: true  # Rank-Stabilized LoRA
  use_dora: false
  loraplus_lr_ratio: null  # DISABLED - logging anomaly suggests possible bug (0 A params, 368 B params)

  # Rank asymmetry - Vision r=64, LLM r=16 (~80M params, optimal capacity)
  # Rank pattern keys are matched by PEFT via SUFFIX match against the full
  # dotted module path (re.match(r".*\." + key + "$", module_name) - verified
  # against peft's actual _create_and_replace source, see
  # github.com/huggingface/peft/issues/2194). This matters here specifically:
  # the previous bare 'linear_fc1'/'linear_fc2' keys matched ALL THREE
  # locations identically - blocks.N.mlp.linear_fc1, merger.linear_fc1, AND
  # deepstack_merger_list.N.linear_fc1 all end in ".linear_fc1", so they were
  # silently sharing one rank, not independently controllable. Decoupled
  # below into three distinct keys per fc1/fc2 (mlp / merger / deepstack) -
  # verified each resolves to exactly one key with no ambiguity and no
  # accidental match against any language_model module. Values are UNCHANGED
  # from before (still 64/128 everywhere) - this is a pure structural
  # refactor so a future experiment can vary each group's rank independently,
  # without this change itself altering training behavior.
  # HYPOTHETICAL RANKS (2026-08-31) - capacity assigned by how domain-specific
  # each component's job is, not by which tower it sits in:
  #   - Attention (spatial routing in vision, sequential routing in the LLM)
  #     is the most likely to transfer cleanly from pretraining -> lightest.
  #   - MLP (per-token feature/content encoding - stroke vs. stain, period
  #     vocabulary, place names) needs real adaptation -> moderate.
  #   - Merger + DeepStack (the vision->LLM translation bridge - the one
  #     piece with no pretrained equivalent at all, regardless of how good
  #     either tower is individually) -> protected at the highest rank.
  # UNVERIFIED: this is a first-principles priority ordering (merger/deepstack
  # > MLP > attention), not confirmed against real training runs the way the
  # earlier vision=64-vs-8 comparison was. Treat the RELATIVE ordering as the
  # actual claim; the specific numbers are a reasonable starting guess, not a
  # measured result.
  rank_pattern:
    qkv: 16                                          # Vision attention (fused QKV) - light, spatial routing should transfer well
    proj: 16                                         # Vision attention output proj - light, same reasoning
    'mlp\.linear_fc1': 32                            # Raw vision block MLP fc1 - moderate, real per-patch feature adaptation
    'mlp\.linear_fc2': 32                            # Raw vision block MLP fc2 - moderate
    'merger\.linear_fc1': 64                         # Merger (vision->LLM bridge) fc1 - protected, no pretrained equivalent
    'merger\.linear_fc2': 64                         # Merger fc2 - protected
    'deepstack_merger_list\.\d+\.linear_fc1': 64     # DeepStack fusion path fc1 - protected, same reasoning as merger
    'deepstack_merger_list\.\d+\.linear_fc2': 64     # DeepStack fusion path fc2 - protected
  alpha_pattern:
    qkv: 32         # Scale alpha proportionally (2*rank)
    proj: 32
    'mlp\.linear_fc1': 64
    'mlp\.linear_fc2': 64
    'merger\.linear_fc1': 128
    'merger\.linear_fc2': 128
    'deepstack_merger_list\.\d+\.linear_fc1': 128
    'deepstack_merger_list\.\d+\.linear_fc2': 128

  # Target modules - Covers vision tower + DeepStack mergers + LLM
  # Vision: blocks (qkv/proj/linear_fc1/2) + merger + deepstack_merger_list
  # LLM: self_attn (q/k/v/o_proj) + mlp (gate/up/down_proj)
  lora_target_modules: '^model\.(?:visual\.(?:blocks\.\d+\.(?:attn\.(?:qkv|proj)|mlp\.linear_fc[12])|merger\.linear_fc[12]|deepstack_merger_list\.\d+\.linear_fc[12])|language_model\.layers\.\d+\.(?:self_attn\.[qkvo]_proj|mlp\.(?:gate|up|down)_proj))'
  freeze_vision_tower: false
  lora_modules_to_save: null  # Merger covered in target_modules regex

  max_pixels: 2016000

  eval_steps: 100
  save_steps: 100
  save_total_limit: 2

  # Compute CER+WER for monitoring (competition metric)
  compute_cer: true  # Also computes WER and competition score (0.5*WER + 0.5*CER)
  metric_for_best_model: "eval_score"  # Use competition metric (not just CER)

  num_workers: 8
  resume_from_checkpoint: true

  # CER computation for early stopping (increased from 200 to reduce noise)
  cer_samples: 500  # Use 500 samples for stable eval_score (37% of val set, low variance)

  # Quick-win regularizers (small dataset optimizations)
  label_smoothing_factor: 0.05  # Handle annotator inconsistency (prsence/presence, publique/public, etc)
  neftune_noise_alpha: 5  # NEFTune - proven for small SFT datasets

  # Early stopping - ELITE: More patient (allow longer training)
  early_stopping:
    enabled: true
    metric: "eval_score"  # FIXED: Watch same metric we optimize (eval_loss rises while CER/WER fall)
    patience: 5  # With cer_samples=500, signal is stable enough for patience=4
    min_delta: 0.0001  # Very small threshold - catches tiny improvements, avoids noise

augmentation:
  enabled: true # Document-aware augmentation based on condition analysis

  # DEGRADATION augmentations (disabled for poor-condition docs)
  p_blur: 0.15         # ENABLED - mild (0.5-1.5px radius), gated off for poor/very-poor via p_degradation_mult
  p_noise: 0.15        # ENABLED - mild (σ=5-15), gated off for poor/very-poor via p_degradation_mult
  p_brightness: 0.3    # RESTORED to the code's own built-in default - realistic scanner exposure variance
  p_contrast: 0.3      # RESTORED to the code's own built-in default - realistic scanner contrast variance

  # GEOMETRIC augmentations (INCREASED 1.5x for poor-condition docs)
  # Pure coordinate remaps, no quality degradation
  p_rotate: 0.5        # Alignment variation (×1.5 = 0.75 for poor docs)
  max_rotation: 2.0    # ±2 degrees
  p_shear: 0.4         # Scribe slant variation (most important, NOT adaptive)
  max_shear: 6         # ±6 degrees

  # Elastic deformation - simulates paper warping/curling during SCANNING
  # CRITICAL: This is GEOMETRIC (how doc was scanned), NOT degradation!
  # A burnt page can still curl during scanning → INCREASED for poor docs
  # SAFE: Pure geometry, bicubic interpolation preserves faded ink
  p_elastic: 0.3       # Base probability (×1.5 = 0.45 for poor docs)
  elastic_alpha: 20    # Displacement strength (×1.3 = 26 for poor docs)
  elastic_sigma: 6     # Smoothness (higher = gentler warping)
  elastic_interpolation: "bicubic"  # CRITICAL - bilinear smears faded ink

  # DEGRADATION: Color jitter - simulates paper color variance (brown→cream aging)
  # Analysis shows: mean paper color variance = 27.9
  # DISABLED for poor docs (already discolored)
  p_color_jitter: 0.25     # Base probability (×0.0 = DISABLED for poor docs)
  hue_jitter: 0.03         # ±3% hue - very subtle brown/cream shifts
  saturation_jitter: 0.08  # ±8% saturation - subtle aging variation
  # NO brightness/contrast jitter - degrades quality

  # GEOMETRIC: Resolution jitter - prevents overfitting to fixed pixel budget
  # Simulates different scan resolutions (independent of document damage!)
  # INCREASED for poor docs (scan quality varies independently)
  # Correct implementation: jitter max_pixels, not downscale→upscale blur
  p_resolution_jitter: 0.3  # Base probability (×1.2 = 0.36 for poor docs)
  min_pixels_ratio: 0.85    # 85% of max_pixels for normal docs (×0.7 = 59.5% for poor docs - more variance)
  max_pixels_ratio: 1.0     # 100% of max_pixels (2,016,000)

inference:
  checkpoint: "/content/drive/MyDrive/prd/qwen3-4B-single-textdiff-3/best"
  output_csv: "submission_full.csv"
  max_new_tokens: 128  # Targets max at 120 chars - prevents loops structurally
  num_beams: 5
  repetition_penalty: 1.0  # Legal boilerplate has legitimate repetition - don't penalize
  batch_size: 4