# Qwen2-VL OCR Training Config - Competition Setup
# Hardware: A100 80GB

model:
  name: "Qwen/Qwen2-VL-7B-Instruct"

  # Flash Attention (optional - improves speed/memory)
  # Set to false if installation fails or unavailable
  # Auto-fallback to standard attention if Flash Attention errors
  use_flash_attention: true

  use_quantization: false  # full precision on A100 80GB
  torch_dtype: "bfloat16"

data:
  train_csv: "dataset/Train.csv"
  test_csv: "dataset/Test.csv"
  image_dir: "dataset/images"

  # K-Fold Cross-Validation (for limited datasets)
  # Set k_folds=1 to use simple train/val split instead
  k_folds: 5  # 5-fold CV - trains 5 models, uses all data efficiently

  # Only used if k_folds=1 (simple split mode)
  val_split: 0.1  # 10% = ~410 samples (balanced for 4K dataset)
  seed: 42

  # Note: K-Fold uses stratified split by text length to ensure
  # each fold has similar length distribution.
  # This is critical for reliable WER/CER metrics on small datasets.

training:
  output_dir: "outputs/qwen2vl-7b-run4"  # run4 - optimized config

  # Batch
  batch_size: 4
  gradient_accumulation_steps: 4  # effective = 16

  # Schedule - optimal for 4K dataset
  epochs: 3  # sweet spot for dataset size
  learning_rate: 2e-5  # standard for Qwen2-VL
  warmup_ratio: 0.1  # 10% warmup
  lr_scheduler: "cosine"
  weight_decay: 0.05  # stronger regularization to prevent overfitting
  max_grad_norm: 1.0

  # LoRA - balanced capacity for 4K samples
  lora_r: 64  # optimal for this dataset size
  lora_alpha: 128  # 2:1 ratio
  lora_dropout: 0.1  # proper regularization
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  # Image - proven resolution
  max_pixels: 2016000  # ~1420x1420 - stable and efficient

  # Eval & Save
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  metric_for_best_model: "eval_loss"

  # Workers
  num_workers: 8

augmentation:
  enabled: true
  # Focus on realistic scanning variations only
  # Historical documents are already degraded - avoid adding artificial degradation
  p_blur: 0.0       # Disabled - documents already have focus issues
  p_noise: 0.0      # Disabled - documents already have paper texture/grain
  p_brightness: 0.3 # Different scan exposures (realistic)
  p_contrast: 0.3   # Ink fade variations (realistic)
  p_rotate: 0.1     # Small alignment issues (realistic)
  max_rotation: 1   # ±1 degree (conservative)

inference:
  # Use "best" checkpoint (saved at lowest eval_loss during training)
  # Run1: eval_loss=0.7017, Run2: eval_loss=0.67, Run3: eval_loss=0.8045 (overfitted)
  checkpoint: "outputs/qwen2vl-7b-run4/best"  # run4: optimized config
  output_csv: "submission.csv"
  max_new_tokens: 256
  num_beams: 5
  batch_size: 1
