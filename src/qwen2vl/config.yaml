# Qwen2-VL OCR Training Config - Competition Setup
# Hardware: A100 80GB

model:
  name: "Qwen/Qwen2-VL-7B-Instruct"
  use_flash_attention: true
  use_quantization: false  # full precision on A100 80GB
  torch_dtype: "bfloat16"

data:
  train_csv: "dataset/Train.csv"
  test_csv: "dataset/Test.csv"
  image_dir: "dataset/images"
  val_split: 0.1
  seed: 42

training:
  output_dir: "outputs/qwen2vl-7b-run1"

  # Batch
  batch_size: 4
  gradient_accumulation_steps: 4  # effective = 16

  # Schedule
  epochs: 5
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  lr_scheduler: "cosine"
  weight_decay: 0.01
  max_grad_norm: 1.0

  # LoRA
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  # Image
  max_pixels: 2016000  # ~1344x1500

  # Eval & Save
  eval_steps: 100
  save_steps: 100
  save_total_limit: 3
  metric_for_best_model: "eval_loss"

  # Workers
  num_workers: 8

augmentation:
  enabled: true
  # Probabilities
  p_blur: 0.2
  p_noise: 0.2
  p_brightness: 0.3
  p_contrast: 0.3
  p_rotate: 0.1
  max_rotation: 2  # degrees

inference:
  checkpoint: "outputs/qwen2vl-7b-run1/best"
  output_csv: "submission.csv"
  max_new_tokens: 256
  num_beams: 5
  batch_size: 1
