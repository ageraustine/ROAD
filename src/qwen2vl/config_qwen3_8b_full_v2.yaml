# Qwen3-VL-8B Full Dataset Training V2 (Different Seed for Ensemble)
# Train on 90% of data with DIFFERENT train/val split than v1
# Purpose: Ensemble with v1 for diversity while keeping high data per model

model:
  name: "Qwen/Qwen3-VL-8B-Instruct"
  use_flash_attention: true
  use_quantization: false
  torch_dtype: "bfloat16"

data:
  train_csv: "dataset/Train.csv"
  test_csv: "dataset/Test.csv"
  image_dir: "dataset/images"

  # NO K-FOLD - use simple train/val split
  k_folds: 1  # Disables K-fold
  val_split: 0.1  # 90% train (3,688), 10% val (410)
  seed: 123  # DIFFERENT from v1 (was 42) - creates different split

training:
  output_dir: "/content/drive/MyDrive/prd/qwen3-8b-full-v2"  # Different output

  batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16

  # DIFFERENT hyperparameters for ensemble diversity
  epochs: 4  # One more epoch than v1 (gives more time to converge differently)
  learning_rate: 0.000018  # 1.8e-5, slightly lower than v1 (2e-5) - slower, more careful
  warmup_ratio: 0.15  # Longer warmup (vs 0.1) - more stable early training
  lr_scheduler: "cosine"

  # Different regularization (creates diversity)
  weight_decay: 0.08  # Lower than v1 (0.1) - allows model to learn more freely
  max_grad_norm: 1.0
  gradient_checkpointing: true

  # Different LoRA config (more capacity, different representation)
  lora_r: 96  # Higher than v1 (64) - more parameters, can learn different patterns
  lora_alpha: 128  # Keep alpha same (maintains scale)
  lora_dropout: 0.1  # Lower than v1 (0.15) - less aggressive regularization
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  lora_modules_to_save:
    - "merger"  # Train vision projector

  max_pixels: 2016000

  eval_steps: 100
  save_steps: 100
  save_total_limit: 3

  # Longer training = more checkpoints saved
  # With 4 epochs × 231 steps/epoch = 924 total steps
  # Will evaluate 9 times (every 100 steps)

  # Compute CER for monitoring
  compute_cer: true
  metric_for_best_model: "eval_cer"

  num_workers: 8
  resume_from_checkpoint: true

  # Early stopping
  early_stopping:
    enabled: true
    metric: "eval_loss"
    patience: 3
    min_delta: 0.0001

augmentation:
  enabled: true
  # Slightly different probabilities than v1 (creates diversity)
  p_blur: 0.0
  p_noise: 0.0
  p_brightness: 0.35  # Higher than v1 (0.3)
  p_contrast: 0.25    # Lower than v1 (0.3)
  p_rotate: 0.15      # Higher than v1 (0.1)
  max_rotation: 1.5   # Slightly more rotation than v1 (1.0)

inference:
  checkpoint: "/content/drive/MyDrive/prd/qwen3-8b-full-v2/best"
  output_csv: "submission_full_v2.csv"
  max_new_tokens: 150
  num_beams: 5
  batch_size: 8
