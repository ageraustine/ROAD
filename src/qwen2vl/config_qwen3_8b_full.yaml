# Qwen3-VL-8B Full Dataset Training (No K-Fold)
# Train on 90% of data (~3,688 samples) vs K-fold's 80% (~3,278 samples)

model:
  name: "Qwen/Qwen3-VL-8B-Instruct"
  use_flash_attention: true
  use_quantization: false
  torch_dtype: "bfloat16"

data:
  train_csv: "dataset/Train.csv"
  test_csv: "dataset/Test.csv"
  image_dir: "dataset/images"

  # NO K-FOLD - use simple train/val split
  k_folds: 1  # Disables K-fold
  val_split: 0.1  # 90% train (3,688), 10% val (410)
  seed: 42

training:
  output_dir: "/content/drive/MyDrive/prd/qwen3-8b-full_s1"

  batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16

  # Extended training with anti-overfitting measures
  # v2 overfitted at 4 epochs, so v1 uses stronger regularization for 10 epochs
  epochs: 10
  learning_rate: 0.000015  # Lower LR (1.5e-5, was 2e-5) for more stable convergence
  warmup_ratio: 0.12  # Slightly longer warmup for stability
  lr_scheduler: "cosine"

  # STRONGER regularization to prevent overfitting like v2
  weight_decay: 0.12  # Increased from 0.1 (stronger L2 regularization)
  max_grad_norm: 1.0
  gradient_checkpointing: true

  # LoRA config - conservative for long training
  lora_r: 64  # Keep at 64 (v2's 96 led to overfitting)
  lora_alpha: 128
  lora_dropout: 0.18  # Increased from 0.15 for stronger regularization
  lora_target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

  lora_modules_to_save:
    - "merger"  # Train vision projector

  max_pixels: 2016000

  eval_steps: 100
  save_steps: 100
  save_total_limit: 3

  # Compute CER+WER for monitoring (competition metric)
  compute_cer: true  # Also computes WER and competition score (0.5*WER + 0.5*CER)
  metric_for_best_model: "eval_score"  # Use competition metric (not just CER)

  num_workers: 8
  resume_from_checkpoint: true

  # Early stopping - more patient for longer training
  early_stopping:
    enabled: true
    metric: "eval_loss"
    patience: 4  # Increased from 3 (allow more time before stopping)
    min_delta: 0.0001

augmentation:
  enabled: true
  # SAFE augmentations only (documents already degraded)
  p_blur: 0.0  # Disabled (documents already degraded)
  p_noise: 0.0  # Disabled (documents already have grain)
  p_brightness: 0.35  # Safe - models exposure variation
  p_contrast: 0.35    # Safe - models ink fade variation
  p_rotate: 0.15      # Safe - small rotation models scan skew
  max_rotation: 1.5

  # Advanced HTR augmentations - DISABLED (risky on degraded docs)
  p_morphology: 0.0  # DISABLED - can destroy strokes on faded ink
  p_shear: 0.0       # DISABLED - distorts characters on degraded text
  max_shear: 8
  p_resolution: 0.0  # DISABLED - adds blur to already blurry scans
  p_jpeg: 0.0        # DISABLED - adds artifacts to already artifacted scans

inference:
  checkpoint: "outputs/qwen3-8b-full/best"
  output_csv: "submission_full.csv"
  max_new_tokens: 150  # reduced from 256 to prevent hallucination
  num_beams: 5
  batch_size: 8
