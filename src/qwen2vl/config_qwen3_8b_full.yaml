# Qwen3-VL-8B Full Dataset Training (No K-Fold)
# Train on 90% of data (~3,688 samples) vs K-fold's 80% (~3,278 samples)

model:
  name: "Qwen/Qwen3-VL-8B-Instruct"
  use_flash_attention: true
  use_quantization: false
  torch_dtype: "bfloat16"

data:
  train_csv: "dataset/Train.csv"
  test_csv: "dataset/Test.csv"
  image_dir: "dataset/images"

  # NO K-FOLD - use simple train/val split
  k_folds: 1  # Disables K-fold
  val_split: 0.1  # 90% train (3,688), 10% val (410)
  seed: 42

training:
  output_dir: "/content/drive/MyDrive/prd/qwen3-8b-full_s2"  # Anti-overfitting version

  batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16

  # Maximum single model performance - aiming for 0.87-0.89
  epochs: 8  # Extended training with very low LR
  learning_rate: 0.00006  # 6e-5 (very low for careful, long training)
  warmup_ratio: 0.18  # Longer warmup for stability
  lr_scheduler: "cosine"

  # Stronger regularization to prevent overfitting with higher vision rank
  weight_decay: 0.04  # Strong regularization for r=96 vision (was 0.03)
  max_grad_norm: 1.0
  gradient_checkpointing: true

  # LoRA config - Asymmetric ranks (Vision r=64, LLM r=16)
  # Vision tower needs capacity for new script; LLM just needs task adaptation
  lora_r: 16  # Base rank for LLM
  lora_alpha: 32
  lora_dropout: 0.1  # Increased from 0.05 (stronger regularization)
  use_rslora: true  # Rank-Stabilized LoRA

  # Rank asymmetry - Vision r=96, LLM r=16 (~120M params, more vision capacity)
  rank_pattern:
    qkv: 96         # Vision attention (critical for stroke patterns) - INCREASED
    proj: 96        # Vision output projection - INCREASED
    linear_fc1: 96  # Vision MLP layer 1 (learns visual features) - INCREASED
    linear_fc2: 96  # Vision MLP layer 2 (learns visual features) - INCREASED
  alpha_pattern:
    qkv: 192        # Scale alpha proportionally
    proj: 192
    linear_fc1: 192
    linear_fc2: 192

  # Target modules - Covers vision tower + DeepStack mergers + LLM
  # Vision: blocks (qkv/proj/linear_fc1/2) + merger + deepstack_merger_list
  # LLM: self_attn (q/k/v/o_proj) + mlp (gate/up/down_proj)
  lora_target_modules: '^model\.(?:visual\.(?:blocks\.\d+\.(?:attn\.(?:qkv|proj)|mlp\.linear_fc[12])|merger\.linear_fc[12]|deepstack_merger_list\.\d+\.linear_fc[12])|language_model\.layers\.\d+\.(?:self_attn\.[qkvo]_proj|mlp\.(?:gate|up|down)_proj))'

  lora_modules_to_save: null  # Merger covered in target_modules regex

  max_pixels: 2016000

  eval_steps: 100
  save_steps: 100
  save_total_limit: 3

  # Compute CER+WER for monitoring (competition metric)
  compute_cer: true  # Also computes WER and competition score (0.5*WER + 0.5*CER)
  metric_for_best_model: "eval_score"  # Use competition metric (not just CER)

  num_workers: 8
  resume_from_checkpoint: true

  # Early stopping - use competition metric, stop at peak
  early_stopping:
    enabled: true
    metric: "eval_score"  # Use actual competition metric (not loss)
    patience: 6  # Stop after 6 evals (600 steps) without improvement (longer for 8 epochs)
    min_delta: 0.0005  # Smaller delta for fine improvements

augmentation:
  enabled: true
  # SAFE augmentations only (documents already degraded)
  # Increased probabilities to add more variation (fights overfitting)
  p_blur: 0.0  # Disabled (documents already degraded)
  p_noise: 0.0  # Disabled (documents already have grain)
  p_brightness: 0.45  # Increased from 0.35 (more exposure variation)
  p_contrast: 0.45    # Increased from 0.35 (more ink fade variation)
  p_rotate: 0.20      # Increased from 0.15 (more scan skew variation)
  max_rotation: 2.0   # Increased from 1.5 (slightly more range)

  # Advanced HTR augmentations - DISABLED (risky on degraded docs)
  p_morphology: 0.0  # DISABLED - can destroy strokes on faded ink
  p_shear: 0.0       # DISABLED - distorts characters on degraded text
  max_shear: 8
  p_resolution: 0.0  # DISABLED - adds blur to already blurry scans
  p_jpeg: 0.0        # DISABLED - adds artifacts to already artifacted scans

inference:
  checkpoint: "outputs/qwen3-8b-full/best"
  output_csv: "submission_full.csv"
  max_new_tokens: 150  # reduced from 256 to prevent hallucination
  num_beams: 5
  batch_size: 8
